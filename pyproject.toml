[project]
name = "jsonhub-cli"
version = "0.2.0"
description = "jsonhub - the command line interface for JsonHub"
readme = "README.md"
authors = [
    { name = "Łukasz Bacik", email = "mail@luka.sh" }
]
license = "MIT"
requires-python = ">=3.11"
keywords = ["jsonhub", "cli", "json", "api-client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]
dependencies = [
    "jsonhub-sdk>=1.0.0,<2.0.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
]

[project.urls]
Repository = "https://github.com/lbacik/jsonhub-cli"

[project.scripts]
jsonhub = "jsonhub_cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-httpx>=0.35.0",
    "mypy>=1.14.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "jsonhub_sdk.*"
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
